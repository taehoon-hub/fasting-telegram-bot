<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공복 현황판</title>

  <style>
    :root {
      color-scheme: light;
      --page: #f5f5f5;
      --card: #ffffff;
      --soft: #f7f7f7;
      --line: #e5e5e5;
      --text: #222222;
      --muted: #777777;
      --accent: #222222;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 0;
      margin: 0;
      padding: 0;
      background: var(--page);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
      overflow-x: hidden;
    }

    body {
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 28px 28px 30px;
      border-radius: 24px;
      background: var(--card);
    }

    .page-header {
      margin-bottom: 22px;
    }

    .brand {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .title-line {
      display: flex;
      align-items: baseline;
      gap: 12px;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 27px;
      line-height: 1.2;
    }

    .group-label {
      color: #999999;
      font-size: 17px;
    }

    .meta {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .notice {
      margin: 4px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      background: #e9e9e9;
      color: #222222;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .message {
      margin: 14px 0;
      padding: 14px;
      border-radius: 14px;
      background: #fff3f3;
      color: #b42318;
      font-size: 13px;
    }

    .board-card {
      margin-top: 18px;
      padding: 22px 20px;
      border-radius: 20px;
      background: var(--soft);
    }

    .board-card h2 {
      margin: 0 0 20px;
      font-size: 21px;
    }

    .table-wrap {
      width: 100%;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    th,
    td {
      padding: 9px 2px;
      border-bottom: 1px solid var(--line);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-weight: 500;
    }

    td:nth-child(2),
    th:nth-child(2) {
      text-align: left;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 9%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 24%;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 17%;
    }

    th:nth-child(4),
    td:nth-child(4) {
      width: 15%;
    }

    th:nth-child(n+5),
    td:nth-child(n+5) {
      width: 8.75%;
    }

    .empty-row {
      padding: 18px 0;
      color: var(--muted);
      text-align: left;
    }

    .mobile-list {
      display: none;
    }

    .bottom-button {
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .app {
        padding: 24px 18px 26px;
        border-radius: 22px;
      }

      h1 {
        font-size: 25px;
      }

      .group-label {
        font-size: 16px;
      }

      .board-card {
        padding: 20px 16px;
      }

      .table-wrap {
        display: none;
      }

      .mobile-list {
        display: grid;
        gap: 10px;
      }

      .mobile-row {
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #ffffff;
      }

      .mobile-row-top {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        margin-bottom: 10px;
      }

      .mobile-rank {
        flex: 0 0 auto;
        color: var(--muted);
      }

      .mobile-name {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
      }

      .mobile-percent {
        flex: 0 0 auto;
        font-weight: 700;
      }

      .mobile-target {
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .mobile-scores {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;
      }

      .mobile-score {
        min-width: 0;
        padding: 7px 2px;
        border-radius: 8px;
        background: #f1f1f1;
        text-align: center;
        font-size: 10px;
      }

      .mobile-score strong {
        display: block;
        margin-top: 3px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="page-header">
      <p class="brand">FASTING MASTER</p>

      <div class="title-line">
        <h1 id="board-title">현황판</h1>
        <span id="group-label" class="group-label"></span>
      </div>

      <p id="board-updated" class="meta">
        데이터를 불러오는 중입니다.
      </p>

      <p class="notice">
        실시간 진행자는 포함되며 정기자료는 매시 정각과 30분에 갱신됩니다.
      </p>

      <button id="refresh-button" type="button">
        최신 정기자료 확인
      </button>
    </header>

    <div id="loading-box" class="message">
      현황판을 불러오는 중...
    </div>

    <div id="error-box" class="message" hidden></div>

    <section id="active-section" class="board-card" hidden>
      <h2>
        현재 진행 순위
        <span id="active-count"></span>
      </h2>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>순위</th>
              <th>이름</th>
              <th>목표</th>
              <th>%</th>
              <th>100</th>
              <th>95</th>
              <th>90</th>
              <th>80</th>
            </tr>
          </thead>
          <tbody id="active-body"></tbody>
        </table>
      </div>

      <div id="active-mobile-list" class="mobile-list"></div>
    </section>

    <section class="board-card">
      <h2>공복 목표 달성</h2>

      <p class="notice">
        24시간 내 목표 달성자를 보여줍니다.
      </p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>목표</th>
              <th>100</th>
              <th>95</th>
              <th>90</th>
              <th>80</th>
              <th>검수</th>
            </tr>
          </thead>
          <tbody id="completed-body"></tbody>
        </table>
      </div>

      <div id="completed-empty" class="empty-row">
        24시간 내 목표 달성자가 없습니다.
      </div>

      <div id="completed-mobile-list" class="mobile-list"></div>
    </section>

    <div id="empty-box" class="message" hidden>
      현재 진행 중인 공복 데이터가 없습니다.
    </div>

    <button
      class="bottom-button"
      type="button"
      onclick="history.back()"
    >
      돌아가기
    </button>
  </main>

  <script src="/board.js?v=20260818-3"></script>
</body>
</html>
