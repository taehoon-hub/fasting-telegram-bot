<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fasting Board</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #ffffff;
      color: #111111;
      font-family: Arial, sans-serif;
    }

    .app-shell {
      max-width: 720px;
      margin: 0 auto;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .eyebrow {
      color: #777777;
      font-size: 12px;
      letter-spacing: 1px;
    }

    h1 {
      margin: 4px 0;
      font-size: 24px;
    }

    .updated {
      color: #666666;
      font-size: 14px;
    }

    .icon-button {
      padding: 10px 14px;
      border: 0;
      border-radius: 8px;
      background: #2481cc;
      color: #ffffff;
      font-size: 14px;
    }

    .message {
      margin-top: 20px;
      padding: 16px;
      border-radius: 8px;
      background: #f1f3f5;
    }

    .error {
      background: #ffe3e3;
      color: #c92a2a;
    }

    .board-section {
      margin-top: 24px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-wrap {
      overflow-x: auto;
    }

    .board-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .board-table th,
    .board-table td {
      padding: 10px 6px;
      border-bottom: 1px solid #dddddd;
      text-align: left;
      white-space: nowrap;
    }

    [hidden] {
      display: none !important;
    }
  </style>


<style id="mobile-board-style">
html,
body {
  width: 100%;
  max-width: 100%;
  margin: 0;
  overflow-x: hidden !important;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

.board-table {
  width: 100% !important;
  max-width: 100% !important;
  table-layout: fixed !important;
}

.mobile-board-cards {
  display: none;
}

@media (max-width: 600px) {
  .board-table {
    display: none !important;
  }

  .mobile-board-cards {
    display: grid;
    width: 100%;
    max-width: 100%;
    gap: 10px;
    padding: 8px 0;
  }

  .mobile-board-card {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    padding: 12px;
    border: 1px solid #d9dee7;
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    overflow: hidden;
  }

  .mobile-board-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    min-width: 0;
    margin-bottom: 8px;
  }

  .mobile-board-rank {
    flex: 0 0 auto;
    color: #64748b;
    font-size: 13px;
  }

  .mobile-board-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 17px;
    font-weight: 700;
  }

  .mobile-board-progress {
    flex: 0 0 auto;
    color: #2563eb;
    font-size: 14px;
    font-weight: 700;
  }

  .mobile-board-info {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 5px;
    width: 100%;
  }

  .mobile-board-score {
    min-width: 0;
    padding: 7px 3px;
    border-radius: 8px;
    background: #f1f5f9;
    text-align: center;
    font-size: 11px;
  }

  .mobile-board-score strong {
    display: block;
    font-size: 14px;
  }

  body,
  main,
  section,
  div {
    min-width: 0;
    max-width: 100%;
  }

  h1,
  h2,
  h3,
  p,
  button,
  input,
  select {
    max-width: 100%;
    overflow-wrap: anywhere;
  }
}
</style>
<style id="mobile-board-cards-style">
html,
body {
  width: 100% !important;
  max-width: 100% !important;
  min-width: 0 !important;
  overflow-x: hidden !important;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

.mobile-board-cards {
  display: none;
}

@media (max-width: 600px) {
  table.board-table {
    display: none !important;
  }

  .mobile-board-cards {
    display: grid !important;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    gap: 10px;
    overflow: hidden !important;
  }

  .mobile-board-card {
    display: block;
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    padding: 12px;
    border: 1px solid #d9dee7;
    border-radius: 12px;
    background: #fff;
    overflow: hidden !important;
  }

  .mobile-board-card-header {
    display: flex;
    align-items: center;
    width: 100%;
    min-width: 0;
    gap: 8px;
    margin-bottom: 6px;
  }

  .mobile-board-rank {
    flex: 0 0 auto;
    color: #64748b;
    font-size: 13px;
  }

  .mobile-board-name {
    min-width: 0;
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
  }

  .mobile-board-progress {
    flex: 0 0 auto;
    color: #2563eb;
    font-weight: 700;
  }

  .mobile-board-target {
    margin-bottom: 8px;
    color: #64748b;
    font-size: 12px;
  }

  .mobile-board-info {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    gap: 5px;
  }

  .mobile-board-score {
    min-width: 0 !important;
    max-width: 100% !important;
    padding: 6px 2px;
    border-radius: 8px;
    background: #f1f5f9;
    text-align: center;
    overflow: hidden;
  }

  .mobile-board-score span {
    display: block;
    font-size: 10px;
  }

  .mobile-board-score strong {
    display: block;
    margin-top: 3px;
    font-size: 15px;
  }

  body,
  main,
  section,
  div {
    min-width: 0 !important;
    max-width: 100% !important;
  }
}
</style>
</head>

<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">FASTING MASTER</p>
        <h1 id="board-title">Fasting Board</h1>
        <p id="board-updated" class="updated">Loading...</p>
      </div>

      <button id="refresh-button" class="icon-button" type="button">
        Refresh
      </button>
    </header>

    <div id="error-box" class="message error" hidden></div>
    <div id="loading-box" class="message">Loading board...</div>

    <section id="active-section" class="board-section" hidden>
      <div class="section-heading">
        <h2>Active Sessions</h2>
        <span id="active-count"></span>
      </div>

      <div class="table-wrap">
        <table class="board-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Target</th>
              <th>Progress</th>
              <th>100</th>
              <th>95</th>
              <th>90</th>
              <th>80</th>
            </tr>
          </thead>
          <tbody id="active-body"></tbody>
        </table>
      </div>
    </section>

    <section id="completed-section" class="board-section" hidden>
      <div class="section-heading">
        <h2>Completed Sessions</h2>
        <span id="completed-count"></span>
      </div>

      <div class="table-wrap">
        <table class="board-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Target</th>
              <th>Progress</th>
              <th>100</th>
              <th>95</th>
              <th>90</th>
              <th>80</th>
            </tr>
          </thead>
          <tbody id="completed-body"></tbody>
        </table>
      </div>
    </section>

    <div id="empty-box" class="message" hidden>
      No active fasting sessions.
    </div>
  </main>

  <script src="/board.js?v=20260817-5"></script>
</body>
</html>
